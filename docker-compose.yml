services:
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: souvenir
      POSTGRES_PASSWORD: souvenir
      POSTGRES_DB: souvenir
    volumes: [souvenir-postgres:/var/lib/postgresql/data]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [souvenir-elasticsearch:/usr/share/elasticsearch/data]
volumes:
  souvenir-postgres:
  souvenir-elasticsearch:
